<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velochoice — Подбор велосипеда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F6F5F1;
  --white: #FFFFFF;
  --ink: #0E0E0E;
  --muted: #6B6B6B;
  --border: #ECEAE3;
  --accent: #C6F24E;
  --accent2: #FF5A1F;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

/* Custom cursor */
#cursor { display: none; }

/* Scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(32px);
  transition: opacity .7s ease, transform .7s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-left {
  opacity: 0;
  transform: translateX(-40px);
  transition: opacity .8s ease, transform .8s ease;
}
.reveal-left.visible {
  opacity: 1;
  transform: translateX(0);
}

/* Navbar */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .4s, backdrop-filter .4s, box-shadow .4s;
}
nav.scrolled {
  background: rgba(246,245,241,.95);
  backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 var(--border);
}
.nav-logo {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.04em;
  color: var(--ink);
  text-decoration: none;
}
.nav-logo span { color: var(--accent); background: var(--ink); padding: 0 4px; border-radius: 3px; }
.nav-links {
  display: flex; gap: 32px;
  list-style: none;
}
.nav-links a {
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  text-decoration: none;
  transition: color .2s;
}
.nav-links a:hover { color: var(--ink); }
.nav-cta {
  background: var(--ink);
  color: var(--bg) !important;
  padding: 10px 22px;
  border-radius: 100px;
  font-size: 14px !important;
  font-weight: 500 !important;
  text-decoration: none;
  transition: background .2s, transform .2s !important;
  display: inline-block;
}
.nav-cta:hover { background: var(--accent); color: var(--ink) !important; transform: scale(1.02); }

/* Hero */
.hero {
  min-height: 100vh;
  padding: 140px 48px 80px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.hero-content { position: relative; z-index: 2; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 28px;
}
.hero-eyebrow::before {
  content: '';
  display: block; width: 24px; height: 1px;
  background: var(--accent);
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(52px, 6vw, 96px);
  font-weight: 700;
  line-height: 1.0;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin-bottom: 28px;
}
.hero-title em {
  font-style: normal;
  position: relative;
  display: inline-block;
}
.hero-title em::after {
  content: '';
  position: absolute;
  left: 0; bottom: 4px; right: 0;
  height: 6px;
  background: var(--accent);
  z-index: -1;
  border-radius: 2px;
}
.hero-sub {
  font-size: 18px;
  color: var(--muted);
  max-width: 440px;
  line-height: 1.6;
  margin-bottom: 48px;
}
.btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-primary {
  background: var(--ink);
  color: var(--bg);
  padding: 16px 32px;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 15px; font-weight: 500;
  border: none; cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: background .25s, transform .25s;
}
.btn-primary:hover { background: var(--accent); color: var(--ink); transform: scale(1.02); }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  padding: 16px 32px;
  border-radius: 100px;
  font-family: var(--font-body);
  font-size: 15px; font-weight: 500;
  border: 1.5px solid var(--border);
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: border-color .25s, background .25s, transform .25s;
}
.btn-ghost:hover { border-color: var(--accent); background: transparent; color: var(--ink); transform: scale(1.02); }

/* Hero image */
.hero-visual {
  position: relative;
  height: 520px;
}
.hero-img-wrap {
  width: 100%; height: 100%;
  border-radius: 24px;
  overflow: hidden;
  position: relative;
}
.hero-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .8s ease;
}
.hero-img-wrap:hover img { transform: scale(1.04); }
.hero-badge {
  position: absolute;
  bottom: -20px; left: -20px;
  background: var(--accent);
  border-radius: 16px;
  padding: 16px 24px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  line-height: 1.3;
  z-index: 3;
}
.hero-badge strong { display: block; font-size: 28px; letter-spacing: -0.04em; }

/* Marquee */
.marquee-wrap {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 18px 0;
  overflow: hidden;
  background: var(--white);
}
.marquee-track {
  display: flex;
  gap: 48px;
  animation: marquee 28s linear infinite;
  width: max-content;
}
.marquee-track:hover { animation-play-state: paused; }
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.marquee-item {
  font-family: var(--font-display);
  font-size: 14px; font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  display: flex; align-items: center; gap: 48px;
}
.marquee-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

/* Section layout */
section { padding: 100px 48px; }
.section-label {
  font-size: 12px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 4vw, 64px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--ink);
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 56px;
}

/* Categories */
#categories { background: var(--white); }
.cat-scroll-wrap { overflow: hidden; }
.cat-track {
  display: flex; gap: 20px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.cat-track::-webkit-scrollbar { display: none; }
.cat-card {
  flex-shrink: 0;
  width: 320px;
  border-radius: 20px;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--border);
  scroll-snap-align: start;
  transition: transform .3s, box-shadow .3s;
  cursor: pointer;
}
.cat-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 24px 48px rgba(0,0,0,.1);
}
.cat-img {
  height: 220px;
  overflow: hidden;
  position: relative;
}
.cat-img img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .5s ease;
}
.cat-card:hover .cat-img img { transform: scale(1.07); }
.cat-tag {
  position: absolute;
  top: 14px; left: 14px;
  background: rgba(246,245,241,.92);
  backdrop-filter: blur(8px);
  font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 100px;
  color: var(--ink);
}
.cat-body { padding: 24px; }
.cat-name {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.cat-desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
.cat-price {
  font-size: 13px; font-weight: 600;
  color: var(--ink);
  margin-bottom: 16px;
}
.cat-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1.5px solid transparent;
  transition: border-color .2s, gap .2s;
  cursor: pointer;
}
.cat-link:hover { border-color: var(--accent); gap: 10px; }
.cat-link svg { width: 16px; height: 16px; }

/* Process */
#process { background: var(--bg); }
.steps-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
}
.step {
  background: var(--bg);
  padding: 40px 32px;
  position: relative;
  transition: background .3s;
}
.step:hover { background: var(--white); }
.step-num {
  font-family: var(--font-display);
  font-size: 64px;
  font-weight: 700;
  letter-spacing: -0.04em;
  color: var(--border);
  line-height: 1;
  margin-bottom: 20px;
  transition: color .3s;
}
.step:hover .step-num { color: var(--accent); }
.step-name {
  font-family: var(--font-display);
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.step-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }

/* Why us */
#why { background: var(--ink); color: var(--bg); }
#why .section-title { color: var(--bg); }
#why .section-label { color: rgba(246,245,241,.4); }
.why-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  overflow: hidden;
  margin-top: 56px;
}
.why-card {
  background: var(--ink);
  padding: 48px 40px;
  transition: background .3s;
}
.why-card:hover { background: #1a1a1a; }
.why-icon {
  width: 48px; height: 48px;
  margin-bottom: 24px;
  color: var(--accent);
}
.why-name {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  color: var(--bg);
}
.why-desc { font-size: 14px; color: rgba(246,245,241,.55); line-height: 1.7; }

/* Experts */
#experts { background: var(--white); }
.experts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 56px;
}
.expert-card {
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  transition: transform .3s, box-shadow .3s;
}
.expert-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,.08); }
.expert-photo {
  height: 280px;
  background: var(--bg);
  overflow: hidden;
  position: relative;
}
.expert-photo img { width: 100%; height: 100%; object-fit: cover; }
.expert-spec {
  position: absolute;
  bottom: 14px; left: 14px;
  background: var(--accent);
  font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 100px;
  color: var(--ink);
}
.expert-body { padding: 24px; }
.expert-name {
  font-family: var(--font-display);
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.expert-quote {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.65;
  font-style: italic;
}
.expert-quote::before { content: '"'; }
.expert-quote::after { content: '"'; }

/* Reviews */
#reviews { background: var(--bg); }
.reviews-track-wrap { overflow: hidden; position: relative; }
.reviews-track {
  display: flex; gap: 20px;
  transition: transform .5s cubic-bezier(.25,.46,.45,.94);
}
.review-card {
  flex-shrink: 0;
  width: calc((100% - 60px) / 3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px 32px;
  background: var(--white);
  display: flex; flex-direction: column; gap: 24px;
}
.review-stars { display: flex; gap: 3px; }
.review-star { color: var(--accent); font-size: 18px; }
.review-text {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink);
  flex: 1;
}
.review-author { display: flex; align-items: center; gap: 12px; }
.review-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--bg);
  flex-shrink: 0;
}
.review-avatar img { width: 100%; height: 100%; object-fit: cover; }
.review-name { font-size: 14px; font-weight: 600; }
.review-bike { font-size: 12px; color: var(--muted); }
.carousel-controls {
  display: flex; align-items: center; gap: 12px;
  margin-top: 36px;
}
.car-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.car-btn:hover { background: var(--ink); border-color: var(--ink); color: white; }
.car-btn svg { width: 18px; height: 18px; }
.car-dots { display: flex; gap: 6px; }
.car-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--border); cursor: pointer;
  transition: background .2s, width .2s;
  border: none;
}
.car-dot.active { background: var(--ink); width: 20px; border-radius: 3px; }

/* FAQ */
#faq { background: var(--white); }
.faq-list { margin-top: 56px; border-top: 1px solid var(--border); }
.faq-item {
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.faq-q {
  width: 100%; background: none; border: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 28px 0;
  font-family: var(--font-display);
  font-size: 18px; font-weight: 600;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  gap: 16px;
}
.faq-q:hover { color: var(--muted); }
.faq-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .2s, transform .3s;
  font-size: 18px; font-weight: 300;
}
.faq-item.open .faq-icon {
  background: var(--accent);
  transform: rotate(45deg);
}
.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height .4s ease, padding .4s ease;
  font-size: 15px; color: var(--muted); line-height: 1.7;
  padding-bottom: 0;
}
.faq-item.open .faq-a {
  max-height: 300px;
  padding-bottom: 28px;
}

/* Final CTA */
#cta-final {
  background: var(--ink);
  text-align: center;
  padding: 120px 48px;
}
.cta-eyebrow {
  font-size: 12px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase;
  color: rgba(246,245,241,.4);
  margin-bottom: 20px;
}
.cta-title {
  font-family: var(--font-display);
  font-size: clamp(42px, 5vw, 80px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--bg);
  margin-bottom: 40px;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}
.cta-title span { color: var(--accent); }
.btn-accent {
  background: var(--accent);
  color: var(--ink);
  padding: 18px 40px;
  border-radius: 100px;
  font-size: 16px; font-weight: 600;
  border: none; cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: transform .25s, box-shadow .25s;
  letter-spacing: -0.01em;
}
.btn-accent:hover { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(198,242,78,.2); }
.cta-meta {
  margin-top: 16px;
  font-size: 13px;
  color: rgba(246,245,241,.35);
  letter-spacing: .04em;
}
.cta-meta span { margin: 0 6px; }

/* Consultation Form */
#consult-form {
  background: var(--ink);
  padding: 100px 48px;
}
.form-wrap {
  max-width: 720px;
  margin: 0 auto;
}
.form-header {
  text-align: center;
  margin-bottom: 56px;
}
.form-header .cta-eyebrow { color: rgba(246,245,241,.4); margin-bottom: 12px; }
.form-header .cta-title { margin-bottom: 0; font-size: clamp(32px,4vw,56px); }
/* Progress */
.progress-wrap {
  display: flex; align-items: center; gap: 0;
  margin-bottom: 48px;
}
.progress-step {
  display: flex; align-items: center; flex: 1;
}
.prog-circle {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 13px; font-weight: 700;
  color: rgba(246,245,241,.4);
  flex-shrink: 0;
  transition: all .3s;
}
.prog-circle.active { border-color: var(--accent); color: var(--ink); background: var(--accent); }
.prog-circle.done { border-color: var(--accent); background: var(--accent); color: var(--ink); }
.prog-label {
  font-size: 12px; font-weight: 500;
  color: rgba(246,245,241,.35);
  margin-left: 10px;
  white-space: nowrap;
  transition: color .3s;
}
.prog-label.active { color: var(--bg); }
.prog-line {
  flex: 1; height: 1px;
  background: rgba(255,255,255,.1);
  margin: 0 12px;
  position: relative; overflow: hidden;
}
.prog-line::after {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0;
  background: var(--accent);
  width: 0%;
  transition: width .5s ease;
}
.prog-line.filled::after { width: 100%; }
/* Form card */
.form-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 40px;
}
/* Field */
.field-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.field-group.full { grid-template-columns: 1fr; }
.field-group.trio { grid-template-columns: 1fr 1fr 1fr; }
.field {
  display: flex; flex-direction: column; gap: 6px;
}
.field label {
  font-size: 12px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: rgba(246,245,241,.45);
  display: flex; align-items: center; gap: 6px;
}
.field input, .field select, .field textarea {
  background: rgba(255,255,255,.06);
  border: 1.5px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: 12px 16px;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--bg);
  outline: none;
  transition: border-color .2s, background .2s;
  cursor: text;
  -webkit-appearance: none;
}
.field select option { background: #1a1a1a; color: var(--bg); }
.field input::placeholder, .field textarea::placeholder { color: rgba(246,245,241,.25); }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent);
  background: rgba(255,255,255,.09);
}
.field.error input, .field.error select, .field.error textarea { border-color: #ff4d4d; }
.field-err { font-size: 11px; color: #ff6b6b; margin-top: 2px; }
.field textarea { resize: vertical; min-height: 88px; }
/* Tooltip */
.tooltip-wrap { position: relative; display: inline-flex; }
.tooltip-icon {
  width: 16px; height: 16px; border-radius: 50%;
  background: rgba(255,255,255,.15);
  font-size: 10px; font-weight: 700; color: var(--bg);
  display: flex; align-items: center; justify-content: center;

}
.tooltip-box {
  position: absolute;
  bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%);
  background: #2a2a2a;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px; color: rgba(246,245,241,.75);
  width: 220px; line-height: 1.5;
  white-space: normal;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  z-index: 10;
  text-transform: none; letter-spacing: 0; font-weight: 400;
}
.tooltip-wrap:hover .tooltip-box { opacity: 1; }
/* Budget pills */
.pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  padding: 8px 16px;
  border-radius: 100px;
  border: 1.5px solid rgba(255,255,255,.12);

}
.pill:hover { border-color: rgba(255,255,255,.3); color: var(--bg); }
.pill.selected { border-color: var(--accent); background: rgba(198,242,78,.12); color: var(--accent); }
/* Checkbox */
.check-field {
  display: flex; align-items: flex-start; gap: 10px;
  cursor: pointer;
}
.check-field input[type=checkbox] {
  width: 18px; height: 18px; flex-shrink: 0;
  margin-top: 2px; cursor: pointer;
  accent-color: var(--accent);
}
.check-field label {
  font-size: 13px; color: rgba(246,245,241,.55);

}
/* Form nav */
.form-nav {
  display: flex; justify-content: space-between; align-items: center;

}
.btn-form-back {
  background: transparent;
  border: 1.5px solid rgba(255,255,255,.12);

.btn-form-back:hover { border-color: rgba(255,255,255,.3); color: var(--bg); }
.btn-form-next {
  background: var(--accent);
  color: var(--ink);
  padding: 14px 32px; border-radius: 100px;
  font-family: var(--font-body); font-size: 15px; font-weight: 600;
  border: none; cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.btn-form-next:hover { transform: scale(1.03); box-shadow: 0 0 0 6px rgba(198,242,78,.2); }
/* Success */
.form-success {

}
.success-icon {
  width: 72px; height: 72px; border-radius: 50%;

@media (max-width: 640px) {

/* Footer */
footer {

  border-top: 1px solid rgba(255,255,255,.07);

}
.footer-grid {
  display: grid;

.footer-brand { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--bg); letter-spacing: -0.04em; margin-bottom: 12px; }
.footer-brand span { color: var(--accent); background: rgba(198,242,78,.15); padding: 0 4px; border-radius: 3px; }
.footer-desc { font-size: 13px; color: rgba(246,245,241,.45); line-height: 1.7; max-width: 280px; }

.footer-links { list-style: none; display: flex; flex-direction: column; gap: 10px; }

/* Scroll indicator */
.scroll-hint {

.scroll-line {

.scroll-line::after {

  animation: scan 2s ease infinite;
}
@keyframes scan {

  100% { left: 100%; }
}

/* Mobile hamburger */
.nav-hamburger {

/* Responsive */

<script type="text/babel">
// ---- Icons ----

const IconExperience = () => (

const IconSaving = () => (
  <svg className="why-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="1.5">
    <path d="M10 34c0-8 5-14 14-14s14 6 14 14"/>

const IconGuarantee = () => (

    <path d="M17 24l5 5 9-9"/>

// ---- Scroll reveal hook ----
function useReveal(ref) {
  React.useEffect(() => {
    const observer = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
      }),
      { threshold: 0.12 }
    );
    const el = ref.current;
    if (el) { observer.observe(el); }
    return () => observer.disconnect();
  }, []);
}

// ---- Components ----

function Navbar({ brand }) {
  const [scrolled, setScrolled] = React.useState(false);
  const [menuOpen, setMenuOpen] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  React.useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
  }, [menuOpen]);
  const close = () => setMenuOpen(false);
  return (
    <>
      <nav className={scrolled ? 'scrolled' : ''}>
        <a href="#" className="nav-logo">{brand || '{BRAND}'}</a>
        <ul className="nav-links">
          {['Процесс','Почему мы','FAQ'].map(l => {
            const hrefs = {'Процесс':'#process','Почему мы':'#why','FAQ':'#faq'};
            return <li key={l}><a href={hrefs[l]}>{l}</a></li>;
          })}
        </ul>
        <a href="#consult-form" className="nav-links nav-cta" style={{listStyle:'none'}}>Записаться на консультацию</a>
        <button className="nav-hamburger" onClick={() => setMenuOpen(true)} aria-label="Открыть меню">
          <span/><span/><span/>

      </nav>
      <div className={`nav-mobile${menuOpen ? ' open' : ''}`}>
        <button className="nav-mobile-close" onClick={close} aria-label="Закрыть">✕</button>
        {[['Процесс','#process'],['Почему мы','#why'],['FAQ','#faq']].map(([l,h]) => (
          <a key={l} href={h} onClick={close}>{l}</a>
        ))}
        <a href="#consult-form" className="nav-cta" onClick={close}>Записаться на консультацию</a>
      </div>
    </>
  );
}

function Hero({ title }) {
  const ref = React.useRef();
  const imgRef = React.useRef();
  React.useEffect(() => {
    const onScroll = () => {
      if (imgRef.current) {
        const y = window.scrollY * 0.3;
        imgRef.current.style.transform = `translateY(${y}px)`;
      }

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <section className="hero">
      <div className="hero-content">
        <div className="hero-eyebrow reveal" ref={ref}>Консультация 1 500 ₽ · Независимый подбор</div>

          {title || 'Подберём велосипед, на котором захочется ездить'}

        <p className="hero-sub reveal" style={{transitionDelay:'.2s'}}>
          Независимые эксперты. Советуем то, что подходит вам, а не то, что выгодно продать. Консультация 1 500 ₽.
        </p>
        <div className="btn-group reveal" style={{transitionDelay:'.3s'}}>

      </div>

          <svg ref={imgRef} viewBox="0 0 580 420" fill="none" xmlns="http://www.w3.org/2000/svg" style={{width:'100%',height:'100%',willChange:'transform'}}>
            {/* Rear wheel spokes */}
            {Array.from({length:16}).map((_,i)=>{const a=i*Math.PI/8;return<line key={'rs'+i} x1={148+Math.cos(a)*16} y1={286+Math.sin(a)*16} x2={148+Math.cos(a)*104} y2={286+Math.sin(a)*104} stroke="#1a1a1a" strokeWidth="1.5" strokeLinecap="round" opacity="0.7"/>;})}
            {/* Front wheel spokes */}
            {Array.from({length:16}).map((_,i)=>{const a=i*Math.PI/8;return<line key={'fs'+i} x1={416+Math.cos(a)*16} y1={286+Math.sin(a)*16} x2={416+Math.cos(a)*104} y2={286+Math.sin(a)*104} stroke="#1a1a1a" strokeWidth="1.5" strokeLinecap="round" opacity="0.7"/>;})}
            {/* Rear wheel */}
            <circle cx="148" cy="286" r="104" stroke="#0E0E0E" strokeWidth="10"/>
            <circle cx="148" cy="286" r="90" stroke="#0E0E0E" strokeWidth="2" opacity="0.15"/>

            {/* Crank arm */}
            <line x1="270" y1="286" x2="296" y2="306" stroke="#0E0E0E" strokeWidth="7" strokeLinecap="round"/>
            <circle cx="296" cy="306" r="5" fill="#0E0E0E"/>
            {/* Chain ring */}
            <circle cx="270" cy="286" r="30" stroke="#0E0E0E" strokeWidth="4"/>
            <circle cx="270" cy="286" r="24" stroke="#0E0E0E" strokeWidth="1.5" opacity="0.3"/>
            {/* Chain stay left */}
            <path d="M 148 286 Q 200 290 270 286" stroke="#0E0E0E" strokeWidth="7" fill="none" strokeLinecap="round"/>
            {/* Seat stay */}
            <line x1="148" y1="286" x2="290" y2="196" stroke="#0E0E0E" strokeWidth="6" strokeLinecap="round"/>
            {/* Seat tube */}
            <line x1="270" y1="286" x2="290" y2="196" stroke="#0E0E0E" strokeWidth="8" strokeLinecap="round"/>
            {/* Top tube */}
            <line x1="290" y1="196" x2="370" y2="188" stroke="#0E0E0E" strokeWidth="8" strokeLinecap="round"/>
            {/* Down tube */}
            <line x1="370" y1="188" x2="270" y2="286" stroke="#0E0E0E" strokeWidth="8" strokeLinecap="round"/>
            {/* Fork */}
            <path d="M 370 188 Q 400 230 416 286" stroke="#0E0E0E" strokeWidth="8" fill="none" strokeLinecap="round"/>
            {/* Head tube */}
            <line x1="370" y1="188" x2="378" y2="158" stroke="#0E0E0E" strokeWidth="10" strokeLinecap="round"/>

            <line x1="378" y1="158" x2="396" y2="148" stroke="#0E0E0E" strokeWidth="6" strokeLinecap="round"/>

      </div>
    </section>
  );
}

  { q:'В каких городах подбираете?', a:'Во всех городах России. Консультация проходит онлайн в удобном мессенджере.' },

  { q:'Помогаете ли с сервисом и обслуживанием?', a:'Можем подсказать, к кому обратиться в вашем городе. Сами тоже отвечаем на простые вопросы по уходу.' },
  { q:'Работаете ли с детскими велосипедами?', a:'Да. Тут важно не ошибиться с размером и весом — поможем выбрать то, что реально подойдёт ребёнку.' },
  { q:'Сколько времени занимает весь процесс?', a:'Рассматриваем заявку в течение 2 часов. Консультация в среднем занимает 30 минут.' },

function Tooltip({ text }) {
  return (
    <span className="tooltip-wrap">
      <span className="tooltip-icon">?</span>
      <span className="tooltip-box">{text}</span>
    </span>
  );
}

function PillGroup({ options, value, onChange, multi }) {
  const toggle = (v) => {
    if (multi) {
      const arr = Array.isArray(value) ? value : [];
      onChange(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);
    } else {
      onChange(v === value ? '' : v);
    }
  };
  const isSelected = (v) => multi ? (Array.isArray(value) && value.includes(v)) : value === v;
  return (
    <div className="pill-group">
      {options.map(o => (
        <button key={o} type="button" className={`pill${isSelected(o) ? ' selected' : ''}`} onClick={() => toggle(o)}>{o}</button>
      ))}
    </div>
  );
}

function Field({ label, error, tooltip, children, full }) {
  return (
    <div className={`field${error ? ' error' : ''}`} style={full ? {gridColumn:'1/-1'} : {}}>
      <label>{label}{tooltip && <Tooltip text={tooltip}/>}</label>
      {children}
      {error && <span className="field-err">{error}</span>}
    </div>
  );
}

const STEPS = ['О вас','О велосипеде','Связь'];

const budgetOptions = ['до 30 000 ₽','30–60 000 ₽','60–100 000 ₽','100–200 000 ₽','200 000+ ₽'];
const whereOptions = ['Город','Парк / набережная','Грунт / лес','Горы','Шоссе','Всё понемногу'];
const freqOptions = ['Каждый день','Несколько раз в неделю','По выходным','Пару раз в месяц'];
const expOptions = ['Новичок','Катаюсь иногда','Уверенный любитель','Спортсмен'];
const storageOptions = ['Квартира','Подъезд / кладовая','Гараж','Нет места — нужен складной'];
const messengerOptions = ['Telegram','WhatsApp','Viber','ВКонтакте','Телефон'];
const timeOptions = ['Утром (9–12)','Днём (12–17)','Вечером (17–21)','В любое время'];

function ConsultationForm() {
  const [step, setStep] = React.useState(0);
  const [done, setDone] = React.useState(false);
  const [errors, setErrors] = React.useState({});
  const [data, setData] = React.useState({
    name:'', city:'', age:'', gender:'', height:'', inseam:'', weight:'', health:'',
    budget:'', where:[], frequency:'', experience:'', storage:'', hasBike:'', newOrUsed:'',
    messenger:'', contact:'', time:'', comment:'', consent: false
  });

  const set = (k, v) => setData(d => ({...d, [k]: v}));
  const err = (k) => errors[k];
  const clearErr = (k) => setErrors(e => { const n = {...e}; delete n[k]; return n; });

  const validateStep = () => {
    const e = {};
    if (step === 0) {
      if (!data.name.trim()) e.name = 'Введите имя';
      if (!data.city.trim()) e.city = 'Введите город';
    }
    if (step === 1) {
      if (!data.budget) e.budget = 'Выберите бюджет';
      if (!data.where.length) e.where = 'Выберите хотя бы один вариант';
    }
    if (step === 2) {
      if (!data.messenger) e.messenger = 'Выберите мессенджер';
      if (!data.contact.trim()) e.contact = 'Введите контакт';
      if (!data.consent) e.consent = 'Необходимо согласие';
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async () => {
    const text = [
      `🚲 *Новая заявка Velochoice*`,
      ``,
      `*Имя:* ${data.name}`,
      `*Город:* ${data.city}`,
      data.age      ? `*Возраст:* ${data.age}` : '',
      data.gender   ? `*Пол:* ${data.gender}` : '',
      data.height   ? `*Рост:* ${data.height} см` : '',
      data.inseam   ? `*Инсим:* ${data.inseam} см` : '',
      data.weight   ? `*Вес:* ${data.weight} кг` : '',
      data.health   ? `*Здоровье:* ${data.health}` : '',
      ``,
      `*Бюджет:* ${data.budget}`,
      data.where.length ? `*Где ездить:* ${data.where.join(', ')}` : '',
      data.frequency    ? `*Частота:* ${data.frequency}` : '',
      data.experience   ? `*Опыт:* ${data.experience}` : '',
      data.storage      ? `*Хранение:* ${data.storage}` : '',
      data.newOrUsed    ? `*Новый/б.у.:* ${data.newOrUsed}` : '',
      data.hasBike      ? `*Текущий велосипед:* ${data.hasBike}` : '',
      ``,
      `*Мессенджер:* ${data.messenger}`,
      `*Контакт:* ${data.contact}`,
      data.time    ? `*Удобное время:* ${data.time}` : '',
      data.comment ? `*Комментарий:* ${data.comment}` : '',
    ].filter(Boolean).join('\n');

    await Promise.allSettled([
      fetch('https://api.telegram.org/bot8756399755:AAGsMy3MhTVM3Urca08NI8NLVzieqrOPd18/sendMessage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: 722690800, text, parse_mode: 'Markdown' }),
      }),
      fetch('https://formspree.io/f/mwvaynvj', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      }),
    ]);

    setDone(true);
  };

  const next = () => { if (validateStep()) { if (step < 2) setStep(s => s+1); else submit(); } };
  const back = () => { setStep(s => s-1); setErrors({}); };

  const ref = React.useRef(); useReveal(ref);

  if (done) return (
    <section id="consult-form">
      <div className="form-wrap">
        <div className="form-card form-success">
          <div className="success-icon">✓</div>
          <div className="success-title">Заявка принята!</div>
          <p className="success-sub">Свяжемся в течение 2 часов<br/>в удобном мессенджере.</p>
        </div>
      </div>
    </section>
  );

  return (
    <section id="consult-form">
      <div className="form-wrap reveal" ref={ref}>
        <div className="form-header">
          <p className="cta-eyebrow">Начнём?</p>
          <h2 className="cta-title" style={{color:'var(--bg)'}}>Записаться на <span style={{color:'var(--accent)'}}>консультацию</span></h2>
        </div>

        {/* Progress */}
        <div className="progress-wrap">
          {STEPS.map((s, i) => (
            <React.Fragment key={i}>
              <div className="progress-step">
                <div className={`prog-circle${i === step ? ' active' : i < step ? ' done' : ''}`}>{i < step ? '✓' : i+1}</div>
                <span className={`prog-label${i === step ? ' active' : ''}`}>{s}</span>
              </div>
              {i < STEPS.length - 1 && <div className={`prog-line${i < step ? ' filled' : ''}`}></div>}
            </React.Fragment>
          ))}
        </div>

        <div className="form-card">
          {/* Step 1 */}
          {step === 0 && (
            <>
              <div className="field-group">
                <Field label="Имя" error={err('name')}>
                  <input value={data.name} onChange={e=>{set('name',e.target.value);clearErr('name');}} onBlur={()=>{if(!data.name.trim()) setErrors(e=>({...e,name:'Введите имя'}));}} placeholder="Как вас зовут?"/>
                </Field>
                <Field label="Город" error={err('city')}>
                  <input value={data.city} onChange={e=>{set('city',e.target.value);clearErr('city');}} placeholder="Москва"/>
                </Field>
              </div>
              <div className="field-group trio">
                <Field label="Возраст">
                  <input type="number" value={data.age} onChange={e=>set('age',e.target.value)} placeholder="30" min="5" max="99"/>
                </Field>
                <Field label="Пол">
                  <select value={data.gender} onChange={e=>set('gender',e.target.value)}>
                    <option value="">Выберите</option>
                    <option>Мужской</option><option>Женский</option><option>Не важно</option>
                  </select>
                </Field>
                <Field label="Рост, см">
                  <input type="number" value={data.height} onChange={e=>set('height',e.target.value)} placeholder="175" min="100" max="230"/>
                </Field>
              </div>
              <div className="field-group trio">
                <Field label="Инсим, см" tooltip="Длина внутреннего шва ноги — от паха до пола. Важна для подбора размера рамы. Измерьте стоя у стены.">
                  <input type="number" value={data.inseam} onChange={e=>set('inseam',e.target.value)} placeholder="82" min="50" max="130"/>
                </Field>
                <Field label="Вес, кг">
                  <input type="number" value={data.weight} onChange={e=>set('weight',e.target.value)} placeholder="75" min="20" max="200"/>
                </Field>
                <div></div>
              </div>
              <div className="field-group full">
                <Field label="Ограничения по здоровью" full>
                  <input value={data.health} onChange={e=>set('health',e.target.value)} placeholder="Боли в спине, коленях и т.д. — если есть"/>
                </Field>
              </div>
            </>
          )}

          {/* Step 2 */}
          {step === 1 && (
            <>
              <div className="field-group full" style={{marginBottom:'20px'}}>
                <Field label="Бюджет" error={err('budget')} full>
                  <PillGroup options={budgetOptions} value={data.budget} onChange={v=>{set('budget',v);clearErr('budget');}}/>
                </Field>
              </div>
              <div className="field-group full" style={{marginBottom:'20px'}}>
                <Field label="Где планируете ездить" error={err('where')} full>
                  <PillGroup options={whereOptions} value={data.where} onChange={v=>{set('where',v);clearErr('where');}} multi/>
                </Field>
              </div>
              <div className="field-group">
                <Field label="Как часто">
                  <select value={data.frequency} onChange={e=>set('frequency',e.target.value)}>
                    <option value="">Выберите</option>
                    {freqOptions.map(o=><option key={o}>{o}</option>)}
                  </select>
                </Field>
                <Field label="Опыт езды">
                  <select value={data.experience} onChange={e=>set('experience',e.target.value)}>
                    <option value="">Выберите</option>
                    {expOptions.map(o=><option key={o}>{o}</option>)}
                  </select>
                </Field>
              </div>
              <div className="field-group">
                <Field label="Где будете хранить">
                  <select value={data.storage} onChange={e=>set('storage',e.target.value)}>
                    <option value="">Выберите</option>
                    {storageOptions.map(o=><option key={o}>{o}</option>)}
                  </select>
                </Field>
                <Field label="Новый или б/у">
                  <select value={data.newOrUsed} onChange={e=>set('newOrUsed',e.target.value)}>
                    <option value="">Не важно</option>
                    <option>Только новый</option>
                  </select>
                </Field>
              </div>
              <div className="field-group full">
                <Field label="Текущий велосипед (если есть)" full>
                  <input value={data.hasBike} onChange={e=>set('hasBike',e.target.value)} placeholder="Марка, модель или «нет»"/>
                </Field>
              </div>
            </>
          )}

          {/* Step 3 */}
          {step === 2 && (
            <>
              <div className="field-group">
                <Field label="Мессенджер" error={err('messenger')}>
                  <PillGroup options={messengerOptions} value={data.messenger} onChange={v=>{set('messenger',v);clearErr('messenger');}}/>
                </Field>
                <Field label="Ваш контакт" error={err('contact')}>
                  <input value={data.contact} onChange={e=>{set('contact',e.target.value);clearErr('contact');}} placeholder="@username или номер"/>
                </Field>
              </div>
              <div className="field-group full" style={{marginBottom:'20px'}}>
                <Field label="Удобное время" full>
                  <PillGroup options={timeOptions} value={data.time} onChange={v=>set('time',v)}/>
                </Field>
              </div>
              <div className="field-group full">
                <Field label="Комментарий" full>
                  <textarea value={data.comment} onChange={e=>set('comment',e.target.value)} placeholder="Любые пожелания, вопросы или детали..."/>
                </Field>
              </div>
              <div className="check-field" style={{marginBottom: err('consent') ? '4px' : '0'}}>
                <input type="checkbox" id="consent" checked={data.consent} onChange={e=>{set('consent',e.target.checked);clearErr('consent');}}/>
                <label htmlFor="consent">Согласен на обработку персональных данных</label>
              </div>
              {err('consent') && <span className="field-err" style={{display:'block',marginBottom:'8px'}}>{err('consent')}</span>}
            </>
          )}

          <div className="form-nav">
            {step > 0
              ? <button className="btn-form-back" onClick={back}>← Назад</button>
              : <span></span>
            }
            <button className="btn-form-next" onClick={next}>
              {step < 2 ? 'Далее →' : 'Отправить заявку'}
            </button>
          </div>
        </div>
      </div>
    </section>
  );
}

  return (

          <p className="footer-desc">Подбираем велосипед под вас — честно, без спешки и лишних слов.</p>

// ---- App ----
function App() {
  // Reveal on mount
  React.useEffect(() => {
    const observer = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
      }),
      { threshold: 0.1 }
    );
    document.querySelectorAll('.reveal, .reveal-left').forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);

  return (
    <>
      <Navbar brand="Velochoice" />
      <Hero />
      <Marquee />
      <Process />
      <Why />
      <FAQ />
      <ConsultationForm />
      <Footer brand="Velochoice" />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
